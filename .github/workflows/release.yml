name: Release
on:
  push:
    branches:
      - master
      - "feature/**"
      - "experiment/**"
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      should-deploy: ${{ steps.check.outputs.changed }}
      is-stable: ${{ steps.check.outputs.stable }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Get current version
        id: get-version
        run: |
          VERSION=$(grep -oP '<version>\K[^<]+' pom.xml | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Compare with previous version
        id: check
        run: |
          CURRENT_VERSION="${{ steps.get-version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          
          # Determine if this is a stable release (master + non-SNAPSHOT)
          if [[ "$BRANCH" == "master" ]] && [[ "$CURRENT_VERSION" != *"SNAPSHOT"* ]]; then
            echo "stable=true" >> $GITHUB_OUTPUT
          else
            echo "stable=false" >> $GITHUB_OUTPUT
          fi
          
          # Skip SNAPSHOT versions on master
          if [[ "$BRANCH" == "master" ]] && [[ "$CURRENT_VERSION" == *"SNAPSHOT"* ]]; then
            echo "SNAPSHOT version on master, skipping release"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # For feature branches always deploy as prerelease
          if [[ "$BRANCH" == feature/* ]] || [[ "$BRANCH" == experiment/* ]]; then
            echo "Feature/experiment branch, will deploy prerelease"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Try to get previous version (for master version change detection)
          if git checkout HEAD~1 2>/dev/null; then
            PREVIOUS_VERSION=$(grep -oP '<version>\K[^<]+' pom.xml | head -1)
            git checkout -
            echo "Previous version: $PREVIOUS_VERSION"
          else
            echo "First commit, treating as version change"
            PREVIOUS_VERSION=""
          fi
          
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed, will deploy"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged, skipping deploy"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi


  build:
    needs: check-version
    runs-on: ubuntu-24.04
    if: needs.check-version.outputs.should-deploy == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Determine release type
        id: release-type
        run: |
          BRANCH="${{ github.ref_name }}"
          IS_STABLE="${{ needs.check-version.outputs.is-stable }}"
          
          if [[ "$IS_STABLE" == "true" ]]; then
            echo "type=stable" >> $GITHUB_OUTPUT
            echo "Stable release"
          else
            echo "type=prerelease" >> $GITHUB_OUTPUT
            echo "Prerelease/experimental deployment"
          fi
        
      - name: Release based on type
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          TYPE="${{ steps.release-type.outputs.type }}"
          
          if [[ "$TYPE" == "stable" ]]; then
            echo "Performing stable release..."
            mvn -B deploy
          else
            echo "Performing prerelease tagging..."
            chmod +x .github/scripts/make-prerelease.sh
            .github/scripts/make-prerelease.sh
            
            mvn -B deploy
          fi